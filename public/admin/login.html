<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light">
<div class="container mt-5" style="max-width:420px"><div class="card p-4 shadow"><h3>Admin Login</h3>
<input id="email" class="form-control mb-2" placeholder="Email" value="admin@bdjobs.gov.bd">
<input id="pass" type="password" class="form-control mb-2" placeholder="Password">
<button id="go" class="btn btn-success w-100">Login</button><div id="msg" class="mt-2"></div></div></div>
<script>
document.getElementById('go').onclick=async()=>{
 const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email:email.value,password:pass.value})});
 if(r.ok){location.href='/admin/'}else document.getElementById('msg').textContent='Login failed: '+await r.text();
};
</script></body></html>
