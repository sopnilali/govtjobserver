<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive - BD Govt Jobs</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/assets/css/style.css" rel="stylesheet"></head><body>
<nav class="navbar bg-white shadow-sm"><div class="container"><a class="navbar-brand" href="/">BD Govt Jobs</a><a href="/" class="btn btn-sm btn-outline-success">Home</a></div></nav>
<div class="container mt-3"><div id="info"></div><div id="list" class="row mt-3"></div></div>
<script src="/assets/js/api.js"></script>
<script>
(async()=>{
 const p=new URLSearchParams(location.search); const kind=p.get('kind')||'category'; const slug=p.get('slug');
 let r;
 if(kind==='institution') r=await apiGet(`/institutions/${slug}/jobs`);
 else if(kind==='author') r=await apiGet(`/authors/${slug}/jobs`);
 else r=await apiGet(`/categories/${slug}/jobs`);
 const head=r.category||r.institution||r.author;
 $('#info').innerHTML=`<h2>${esc(head.name||head.title)}</h2><p class="text-muted">${esc(head.description||head.bio||'')}</p><p>Jobs: ${r.meta?.total??r.data.length}</p>`;
 $('#list').innerHTML=r.data.map(jobCard).join('')||'<p>No jobs.</p>';
 document.title=(head.name||'Archive')+' - BD Govt Jobs';
})();
</script></body></html>
