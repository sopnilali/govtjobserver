<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Details - BD Govt Jobs</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet"></head><body>
<nav class="navbar bg-white shadow-sm"><div class="container"><a class="navbar-brand" href="/">BD Govt Jobs</a><a href="/jobs.html" class="btn btn-sm btn-outline-success">All Jobs</a></div></nav>
<div class="container mt-3" id="wrap"><p>Loading...</p></div>
<footer class="pt-4 pb-3 mt-4"><div class="container"><a href="/">Home</a> | <a href="/jobs.html">Jobs</a></div></footer>
<script src="/assets/js/api.js"></script>
<script>
(async()=>{
 const slug=new URLSearchParams(location.search).get('slug');
 if(!slug){$('#wrap').innerHTML='Missing slug';return}
 try{
  const j=await apiGet('/jobs/slug/'+slug);
  document.title=j.title+' - BD Govt Jobs';
  const blocks=(j.contentBlocks||[]).map(b=>{
    if(b.type==='heading') return `<h4 class="mt-3">${esc(b.title||'')}</h4>`;
    if(b.type==='image'&&b.meta?.url) return `<img src="${esc(b.meta.url)}" class="img-fluid my-2">`;
    if(b.type==='notice') return `<div class="alert alert-info">${b.content||''}</div>`;
    if(b.type==='warning') return `<div class="alert alert-warning">${b.content||''}</div>`;
    if(b.type==='button'&&b.meta?.url) return `<a class="btn btn-success my-2" href="${esc(b.meta.url)}">${esc(b.title||'Open link')}</a>`;
    if(b.type==='video'&&b.meta?.url) return `<div class="ratio ratio-16x9 my-2"><iframe src="${esc(b.meta.url)}" allowfullscreen></iframe></div>`;
    if(b.type==='list') return `<ul>${(b.content||'').split('\n').map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    return `${b.title?`<h5>${esc(b.title)}</h5>`:''}<div>${b.content||''}</div>`;
  }).join('');
  $('#wrap').innerHTML=`
  <nav><a href="/">Home</a> / <a href="/jobs.html">Jobs</a> / ${esc(j.title)}</nav>
  <h2 class="mt-2">${esc(j.title)}</h2><p class="text-muted">${esc(j.institution?.name||'')}</p>
  <div class="card summary-card p-3 mb-3"><div class="row">
   <div class="col-md-8">
    <p><b>Institution:</b> ${esc(j.institution?.name||'-')} ${j.institution?.logo?`<img src="${esc(j.institution.logo)}" height="30">`:''}</p>
    <p><b>Vacancies:</b> ${j.totalPosts??'-'} | <b>Grade:</b> ${esc(j.grade?.name||'-')} ${j.grade?.label?`(${esc(j.grade.label)})`:''}</p>
    <p><b>Salary:</b> ${j.salaryOverride?'৳ '+j.salaryOverride:((j.grade?.salaryMin&&j.grade?.salaryMax)?`৳ ${j.grade.salaryMin} - ${j.grade.salaryMax}`:'As per circular')} | <b>Type:</b> ${esc(j.jobType||'-')}</p>
    <p><b>Published:</b> ${j.publishedAt?new Date(j.publishedAt).toLocaleDateString():'-'} | <b>Start:</b> ${j.applyStart?new Date(j.applyStart).toLocaleDateString():'-'} | <b>Deadline:</b> ${j.applyDeadline?new Date(j.applyDeadline).toLocaleDateString():'-'}</p>
    <p><b>Status:</b> <span class="badge badge-status-${esc(j.applicationStatus)}">${esc(j.applicationStatus)}</span></p>
   </div><div class="col-md-4 d-grid gap-2">
    ${j.applyUrl?`<a class="btn btn-success" href="${esc(j.applyUrl)}" target="_blank">Apply Now</a>`:''}
    ${j.circularPdf?`<a class="btn btn-outline-success" href="${esc(j.circularPdf)}" target="_blank">Download Circular (PDF)</a>`:''}
   </div></div></div>
  ${j.circularImage?`<img src="${esc(j.circularImage)}" class="img-fluid border mb-3" alt="circular">`:''}
  ${j.shortInfo?`<p>${esc(j.shortInfo)}</p>`:''}
  <table class="table table-bordered"><tbody>
   <tr><th>Total Posts</th><td>${j.totalPosts??'-'}</td><th>Grade</th><td>${esc(j.grade?.name||'-')}</td></tr>
   <tr><th>Salary</th><td>${j.salaryOverride??'-'}</td><th>Education</th><td>${j.education||'-'}</td></tr>
   <tr><th>Age Limit</th><td>${esc(j.ageLimit||'-')}</td><th>Experience</th><td>${esc(j.experience||'-')}</td></tr>
   <tr><th>Fee</th><td>${esc(j.applicationFee||'-')}</td><th>Dates</th><td>${j.applyStart?new Date(j.applyStart).toLocaleDateString():'-'} → ${j.applyDeadline?new Date(j.applyDeadline).toLocaleDateString():'-'}</td></tr>
  </tbody></table>
  ${j.applyUrl?`<p><b>How to apply:</b> Apply via <a href="${esc(j.applyUrl)}" target="_blank">official link</a>.</p>`:''}
  <div>${blocks}</div>
  ${(j.faqs||[]).map(f=>`<details class="mb-2"><summary><b>${esc(f.question)}</b></summary><p>${esc(f.answer)}</p></details>`).join('')}
  ${j.author?`<div class="card p-3 mt-3"><b>Author: <a href="/author.html?slug=${esc(j.author.slug)}">${esc(j.author.name)}</a></b><br><small>${esc(j.author.designation||'')}</small></div>`:''}
  <div class="mt-2">Share: <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}" target="_blank" class="btn btn-sm btn-outline-primary">Facebook</a>
  <a href="https://twitter.com/intent/tweet?url=${encodeURIComponent(location.href)}" target="_blank" class="btn btn-sm btn-outline-dark">X</a>
  <button class="btn btn-sm btn-outline-secondary" onclick="navigator.clipboard.writeText(location.href);toast('Link copied')">Copy</button></div>
  <h4 class="mt-4">Related Jobs</h4><div class="row">${(j.related||[]).map(jobCard).join('')}</div>
  <script type="application/ld+json">${esc(JSON.stringify({ '@context': 'https://schema.org', '@type': 'JobPosting', title: j.title, datePosted: j.publishedAt, validThrough: j.applyDeadline }))}<\/script>`;
 }catch(e){$('#wrap').innerHTML='<div class="alert alert-danger">Job not found.</div>'}
})();
</script></body></html>
