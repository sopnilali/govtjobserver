<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notices - BD Govt Jobs</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/assets/css/style.css" rel="stylesheet"></head><body>
<nav class="navbar bg-white shadow-sm"><div class="container"><a class="navbar-brand" href="/">BD Govt Jobs</a></div></nav>
<div class="container mt-3"><h2>Notices</h2><div id="list" class="list-group"></div>
<h2 class="mt-4">Notice Details</h2><div id="detail" class="card p-3"></div></div>
<script src="/assets/js/api.js"></script>
<script>
(async()=>{
 const slug=new URLSearchParams(location.search).get('slug');
 const ns=await apiGet('/notices'); $('#list').innerHTML=ns.map(n=>`<a class="list-group-item" href="/notices.html?slug=${n.slug}">${esc(n.title)}</a>`).join('');
 if(slug){const n=await apiGet('/notices/'+slug); $('#detail').innerHTML=`<h4>${esc(n.title)}</h4><div>${n.content||''}</div>${n.fileUrl?`<a href="${esc(n.fileUrl)}" target="_blank">Attachment</a>`:''}`;}
 else $('#detail').innerHTML='<p class="text-muted">Select a notice.</p>';
})();
</script></body></html>
