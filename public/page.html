<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page - BD Govt Jobs</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/assets/css/style.css" rel="stylesheet"></head><body>
<nav class="navbar bg-white shadow-sm"><div class="container"><a class="navbar-brand" href="/">BD Govt Jobs</a></div></nav>
<div class="container mt-3"><div id="c" class="card p-4">Loading...</div></div>
<script src="/assets/js/api.js"></script>
<script>(async()=>{const slug=new URLSearchParams(location.search).get('slug');try{const p=await apiGet('/pages/'+slug);document.title=p.title;$('#c').innerHTML=`<h2>${esc(p.title)}</h2><div>${p.content||''}</div>`}catch{$('#c').innerHTML='Page not found'}})();</script>
</body></html>
